<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Eco Driving Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
background:radial-gradient(circle at top left,#2a4b7a,#1c2b44,#2a3b60);
font-family:"Segoe UI",Arial,sans-serif;color:#fff;
height:100vh;display:flex;flex-direction:column;overflow:hidden;
}
/* === HEADER === */
.ai-tip-box{flex:0 0 auto;background:#ffa500;color:#000;border-radius:1vh;
margin:1vh 2vw;padding:1.5vh 1vw;text-align:center;font-weight:bold;
font-size:clamp(1rem,2vw,1.6rem);box-shadow:0 0.5vh 1vh rgba(0,0,0,0.4);}
.stats-row{display:flex;justify-content:space-evenly;align-items:stretch;
flex-wrap:wrap;gap:1vh;margin:0 1vw;}
.stat-card{flex:1;min-width:120px;max-width:180px;background:rgba(28,34,48,0.95);
border-radius:1vh;padding:1vh;display:flex;flex-direction:column;justify-content:center;
align-items:center;text-align:center;border:1px solid rgba(255,255,255,0.2);
box-shadow:0 0.3vh 1vh rgba(0,0,0,0.4);}
.stat-label{font-size:0.9rem;opacity:0.8;}
.stat-value{font-size:1.3rem;font-weight:bold;margin-top:0.3rem;}
.speed-box{background:#4e79a7;}
.gear-box{background:#76b7b2;color:#000;}
.throttle-box{background:#2ca02c;color:#000;}
/* === SEARCH === */
.search-row{display:flex;align-items:center;justify-content:center;gap:1vw;margin:1vh 2vw;position:relative;}
#searchInput{flex:1;max-width:70%;padding:0.8vh 1vw;font-size:1rem;border-radius:1vh;
border:none;outline:none;}
#micBtn{background:#ff4c4c;color:#fff;border:none;border-radius:1vh;padding:0.8vh 1.2vw;
font-weight:bold;cursor:pointer;box-shadow:0 0.4vh 1vh rgba(0,0,0,0.3);}
#suggestBox{position:absolute;top:100%;left:10%;width:80%;background:rgba(0,0,0,0.9);
border-radius:1vh;max-height:40vh;overflow-y:auto;z-index:2000;display:none;}
.suggest-item{padding:0.8vh 1vw;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;}
.suggest-item:hover{background:rgba(255,255,255,0.1);}
/* === MAIN (Map now fills space) === */
.main-section{flex:1;display:flex;flex-direction:column;gap:1vh;padding:0 2vw 1vh;}
.map-container{flex:1;position:relative;border-radius:1vh;overflow:hidden;
border:1px solid rgba(255,255,255,0.2);box-shadow:0 0.5vh 1vh rgba(0,0,0,0.4);}
.map{width:100%;height:100%;}
/* === Locate (Target) Button === */
#locate-btn {
  position: absolute;
  bottom: 2vh;
  right: 1vh;
  z-index: 1000;
  background: #1e90ff;
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 1.2rem;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0.4vh 1vh rgba(0,0,0,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.2s ease, background 0.3s ease;
}
#locate-btn:hover {background: #4682b4;transform: scale(1.1);
}
#map-toggle{position:absolute;top:1vh;right:1vh;z-index:1000;background:#ff8c00;
border:none;border-radius:1vh;padding:0.5vh 1vw;font-weight:bold;cursor:pointer;color:#000;}
/* === ROUTE PANEL === */
#routePanel{position:absolute;bottom:2vh;left:2vw;width:270px;max-height:42vh;
overflow-y:auto;background:rgba(0,0,0,0.6);border-radius:1vh;padding:0.5vh;color:#fff;z-index:999;}
.route-box{margin-bottom:0.8vh;border-radius:1vh;overflow:hidden;background:rgba(255,255,255,0.05);backdrop-filter:blur(6px);box-shadow:0 0.4vh 1vh rgba(0,0,0,0.5);}
.route-header{padding:0.6vh 0.6vw;font-weight:bold;display:flex;justify-content:space-between;
align-items:center;color:#fff;font-size:0.9rem;}
.route-content{background:rgba(255,255,255,0.1);padding:0.4vh 0.6vw;font-size:0.85rem;max-height:30vh;overflow-y:auto;transition:all 0.3s ease;}
.route-step{padding:0.4vh 0.3vw;margin-bottom:0.4vh;border-bottom:1px solid rgba(255,255,255,0.1);}
.route-step:hover{background:rgba(255,255,255,0.15);}

/* Car Icon Style (Updated for Car) */
.user-car-icon {
    width: 32px;
    height: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.user-car-svg {
    transform-origin: center;
    transition: transform 0.3s linear;
}

</style>
</head>
<body>
<div class="ai-tip-box" id="ai-tip">Starting system...</div>
<div class="stats-row">
  <div class="stat-card speed-box"><div class="stat-label">Speed</div><div class="stat-value" id="speed">0 km/h</div></div>
  <div class="stat-card gear-box"><div class="stat-label">Gear</div><div class="stat-value" id="gear">N</div></div>
  <div class="stat-card throttle-box"><div class="stat-label">Throttle</div><div class="stat-value" id="throttle">0%</div></div>
</div>

<div class="search-row">
  <input type="text" id="searchInput" placeholder="Search destination...">
  <button id="micBtn">🎤</button>
  <div id="suggestBox"></div>
</div>

<div class="main-section">
  <div class="map-container">
    <div id="map" class="map"></div>
    <button id="map-toggle">Full Map</button>
      <!-- 🆕 Locate Me (Target) Button -->
    <button id="locate-btn" title="Recenter to my location">🎯</button>
    <div id="routePanel"></div>
  </div>
</div> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
/* ===== Map Init ===== */
// Setting a non-specific initial view. GPS will immediately overwrite this to the user's actual location.
const map=L.map('map').setView([0, 0], 2); 
let autoFollow = true; // Track whether we should auto-follow the car
/* =====Multilingual Speech ===== */
function detectLang(text) {
  if (/[أ-ي]/.test(text)) return "ar-SA";
  if (/[а-я]/i.test(text)) return "ru-RU";
  if (/[ก-๙]/.test(text)) return "th-TH";
  if (/[א-ת]/.test(text)) return "he-IL";
  if (/[α-ω]/i.test(text)) return "el-GR";
  return "en-US";
}

// 1️⃣ English Map (CartoDB Positron — clean English-only)
var englishMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap contributors | © CartoDB',
    subdomains: 'abcd',
    maxZoom: 19
});

// 2️⃣ Google Streets Map
var googleMap = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 23,
    subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
});

// 3️⃣ Normal OSM Map (Default)
var osmMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
});

// Default layer
googleMap.addTo(map);

/* === Add Map Layer Control (Top Right Corner) === */
L.control.layers(
  {
    "🗺️ English Map": englishMap,
    "🌍 Google Map": googleMap,
    "🗺️ Map": osmMap,
  },
  null,
  { position: "topright", collapsed: true }
).addTo(map);

// NEW: Use L.divIcon for a rotating car icon
const carIcon = L.divIcon({
    className: 'user-car-icon',
    // Simple car shape pointing up (North=0deg). Change fill color to a darker shade for better visibility.
    html: '<svg id="user-car-svg" class="user-car-svg" width="32" height="32" viewBox="0 0 100 100" fill="#2a3b60" stroke="#fff" stroke-width="3"><path d="M 25 20 L 75 20 L 80 45 L 90 45 L 90 70 L 10 70 L 10 45 L 20 45 Z" /></svg>',
    iconSize: [32, 32],
    iconAnchor: [16, 16] // Center of the icon
});

let userMarker=null,waypoints=[],waypointMarkers=[],routes=[],totalFuel=0;
const colors=['#FF6B6B','#4DA6FF','#FFD93D','#6BCB77','#FF8C00','#9B59B6','#00BFA5'];

// Store for road type information
let currentRoadType = "city"; 
let lastStepLatLng = null;
let lastStepAdvanceTime = 0;

/* ===== Road Type Detection (FIXED for Global Use) ===== */
async function getRoadType(latlng) {
    // --- START FIX: Removed Mumbai-centric logic for global use. ---
    
    // MOCK LOGIC: Use current GPS speed to estimate road type globally.
    // NOTE: calculateGPSSpeed is defined later but accessible via hoisting.
    const speed = calculateGPSSpeed(latlng); 
    
    if (speed > 80) { // High speed suggests highway
        currentRoadType = "highway";
    } else if (speed > 40) { // Medium speed suggests residential or main city road
        currentRoadType = "residential";
    } else if (speed > 10) { // Low speed suggests city/stop-and-go traffic
        currentRoadType = "city";
    } else {
        // Default or stationary
        currentRoadType = "residential";
    }
    
    // Retain mountain/offroad randomness for flavor, as we can't determine it without an API
    if (Math.random() < 0.05) { 
         currentRoadType = Math.random() < 0.5 ? "mountain" : "national highway";
    }
    
    // --- END FIX: Removed Mumbai-centric logic for global use. ---
    return currentRoadType;
}

/* ===== Eco Advisor (MODIFIED for simplicity) ===== */
function ecoAdvisor(dist, elev, turnText) {
    const t = (turnText || '').toLowerCase();
    let tip = "Drive smoothly", speed = 50, gear = 3, throttle = 45;

    // Base settings by road type
    const roadType = currentRoadType;
    if (roadType === "highway" || roadType === "national highway") {
        speed = 90; gear = 5; throttle = 55; tip = "Open road — steady speed";
    } else if (roadType === "city" || roadType === "residential") {
        speed = 40; gear = 3; throttle = 40; tip = "City driving — anticipate stops";
    } else if (roadType === "mountain") {
        speed = 35; gear = 2; throttle = 50; tip = "Mountain road — use engine braking";
    } else if (roadType === "offroad") {
        speed = 20; gear = 1; throttle = 30; tip = "Rough terrain — low gear";
    }

    // Turn adjustments
    if (t.includes("left") || t.includes("right")) {
        speed = 25; gear = 2; throttle = 35; tip = "Slow for turn";
    }

    // Elevation slope handling
    if (elev > 2.5) { // Downhill
        speed = Math.min(speed, 40);
        gear = 3; throttle = 20; tip = "Downhill — maintain control";
    } else if (elev < -2.5) { // Uphill
        speed = Math.max(speed, 50);
        gear = 4; throttle = 60; tip = "Uphill — steady acceleration";
    }

    // Long straight sections
    if (dist > 800) tip += " | Long straight ahead";

    return { speed, gear, throttle, tip, roadType };
}



/* ===== Driver Behavior Monitoring (Unchanged) ===== */
let driverStats = { overspeed: 0, harshAccel: 0, totalPoints: 0 };
let spokenWarnings = new Set();  

function updateDriverBehavior(currentSpeed, eco) {
    driverStats.totalPoints++;
    let warnings = [];

    // Overspeed detection
    if (currentSpeed > eco.speed + 10) { // Increased tolerance to 10km/h
        driverStats.overspeed++;
        if (!spokenWarnings.has('overspeed') || driverStats.overspeed % 10 === 0) { // Speak initially and then every 10 counts
            warnings.push("Excessive speed detected");
            spokenWarnings.add('overspeed');
        }
    } else {
        spokenWarnings.delete('overspeed'); // Clear warning if speed is fine
    }

    // Harsh acceleration detection
    const lastThrottle = parseFloat(document.getElementById("throttle").dataset.lastThrottle || 0);
    const currentThrottle = eco.throttle;
    if (Math.abs(currentThrottle - lastThrottle) > 30) { // Adjusted tolerance to 30
        driverStats.harshAccel++;
        if (!spokenWarnings.has('harshAccel')) {
            warnings.push("Harsh acceleration detected");
            spokenWarnings.add('harshAccel');
        }
    }
    document.getElementById("throttle").dataset.lastThrottle = currentThrottle;

    // Voice alert for warnings
    if ('speechSynthesis' in window && warnings.length) {
        const msg = new SpeechSynthesisUtterance(warnings.join(" "));
        msg.rate = 1.2; msg.pitch = 1.2; // Make warnings more distinct
        if (speechSynthesis.speaking) { speechSynthesis.cancel(); } // Cancel step speech for urgent warning
        speechSynthesis.speak(msg);
        
        // Show overspeeding warning in tip box too
        if (warnings.includes("Excessive speed detected")) {
             document.getElementById("ai-tip").textContent = "⚠️ OVERSPEED WARNING ⚠️";
        }
    }
}
/* ===== Overspeed Alert + Speech Stability ===== */
function cancelSpeech() { try { speechSynthesis.cancel(); } catch {} }

function overspeedWarning(currentSpeed, ecoSpeed) {
  if (currentSpeed > ecoSpeed + 10) {
    const warn = `⚠️ Overspeed! Reduce speed to ${ecoSpeed} km/h`;
    document.getElementById("ai-tip").textContent = warn;
    cancelSpeech();
    const msg = new SpeechSynthesisUtterance(warn);
    msg.lang = detectLang(step.text);
    msg.rate = 1.1;
    speechSynthesis.speak(msg);
  }
}

// dynamicEcoAdvisor is now primarily handled by the improved ecoAdvisor which integrates road type
function dynamicEcoAdvisor(currentSpeed, slopeAhead, distToNextStep){
    return ecoAdvisor(distToNextStep, slopeAhead, "");
}

async function getElevations(coords){
    try{
        const locs=coords.map(p=>`${p.lat},${p.lng}`).join('|');
        // Using a CORS-enabled proxy for Open-Elevation or a mock response
        // In this environment, we'll mock the call to prevent errors.
        // const r=await fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${encodeURIComponent(locs)}`);
        // const d=await r.json();
        // return d.results.map(x=>x.elevation);
        
        // Mocking elevation results for a more stable demo
        return new Array(coords.length).fill(0).map((_, i) => Math.sin(i * 0.1) * 50 + Math.random() * 5);

    }catch{return new Array(coords.length).fill(0);}
}

/* ===== Multi-Step Route Awareness (Unchanged) ===== */
async function getUpcomingSteps(latlng, maxSteps=5){
  if(!routes.length) return [];
  const upcomingSteps=[];
  routes.forEach(r=>{
    let nearestIdx=-1, minDist=Infinity;
    r.steps.forEach((s,i)=>{
      const d=latlng.distanceTo([s.lat,s.lng]);
      if(d<minDist){ minDist=d; nearestIdx=i; }
    });
    if(nearestIdx!==-1){
      for(let j=nearestIdx; j<Math.min(r.steps.length, nearestIdx+maxSteps); j++){
        upcomingSteps.push(r.steps[j]);
      }
    }
  });
  return upcomingSteps;
}

/* ====== Step-by-Step AI Voice Guidance & Dashboard Update (FIXED) ====== */
let activeRouteIndex = null;
let currentStepIndex = 0;
let nextStepReady = true;
let speechTimer = null; // Failsafe timer

async function adaptiveAIDashboard(latlng, heading) {
  // 1. Get Real-time Data
  const currentSpeed = calculateGPSSpeed(latlng);
  const slopeData = await predictElevationAhead(latlng, heading);
  const slope = slopeData.slope;
  await getRoadType(latlng); // Update global currentRoadType
 
  // 2. Calculate Eco Advice (Always based on real-time data)
  const eco = dynamicEcoAdvisor(currentSpeed, slope, 800); // Use 800m lookahead distance for general advice
 
  // 3. Route Guidance Logic
  if (routes.length && activeRouteIndex !== null) {
    const route = routes[activeRouteIndex];
    const steps = route.steps;
    const routeDisplayIndex = route.routeIndex;

    if (currentStepIndex < steps.length) {
      const step = steps[currentStepIndex];
      const stepLatLng = L.latLng(step.lat, step.lng);
      const distanceToStep = latlng.distanceTo(stepLatLng);

      // Remaining Distance Calculation
      let remainingDistance = distanceToStep;
      for (let i = currentStepIndex + 1; i < steps.length; i++) {
        remainingDistance += steps[i].distance;
      }
      const distanceEl = document.getElementById(`route-distance-${routeDisplayIndex}`);
      if (distanceEl) {
        distanceEl.textContent = `${(remainingDistance / 1000).toFixed(1)} km remaining`;
      }

      // Update Tip Box with upcoming step
      const upcomingStepDistance = step.distance < 1000 ? `${step.distance.toFixed(0)} m` : `${(step.distance / 1000).toFixed(1)} km`;
      document.getElementById("ai-tip").textContent = `Next: ${step.text} (${upcomingStepDistance}) | Eco: ${eco.tip}`;

      if (!driverCountry) updateDriverCountry(latlng);

      // Voice/Step Trigger (FIXED)
      if (distanceToStep <= 100 && nextStepReady) { // Trigger earlier at 100m
        nextStepReady = false; // LOCK
        
        // Get specific eco advice for the upcoming turn (using the old eco advisor with step data)
        const stepEco = ecoAdvisor(step.distance, step.elev, step.text); 

        // Determine distance for speech
        const stepDistanceSpeech = step.distance < 1000 ? `${step.distance.toFixed(0)} meters` : `${(step.distance / 1000).toFixed(1)} kilometers`;

        // Voice alert (sequential speech)
        if ("speechSynthesis" in window) {
          speechSynthesis.cancel(); // Always cancel previous speech

          // 1. Speak Step Instruction and Distance
          const stepMsg = new SpeechSynthesisUtterance(`${step.text}. Proceed for ${stepDistanceSpeech}.`);
          stepMsg.rate = 1; stepMsg.pitch = 1;
          
          // 2. Speak Eco Tip after step instruction (NO SPEED/GEAR)
          const ecoMsg = new SpeechSynthesisUtterance(`Eco Tip: ${stepEco.tip}`);
          ecoMsg.rate = 1; ecoMsg.pitch = 1;

          const advanceStep = () => {
            clearTimeout(speechTimer); // Clear failsafe timer
            // Remove current step visuals
            if (step.element) step.element.remove();
            if (step.lineLayer) route.group.removeLayer(step.lineLayer);
            if (step.connectorLine) route.group.removeLayer(step.connectorLine);
            // Also remove the connecting line to next step (if any)
            if (step.connectorLine) route.group.removeLayer(step.connectorLine);
            currentStepIndex++; // Advance step
            nextStepReady = true; // UNLOCK
            // If the route is finished, this will be handled in the next GPS loop
            if (currentStepIndex >= steps.length) {
                activeRouteIndex = null;
                currentStepIndex = 0;
                document.getElementById("ai-tip").textContent = "Destination reached ✅";
            }
          };
          
          ecoMsg.onend = advanceStep; // After eco tip, advance/unlock

          stepMsg.onend = () => {
            // Stop any speech (if a warning was inserted) and speak eco tip
            if (speechSynthesis.speaking) { speechSynthesis.cancel(); }
            document.getElementById("ai-tip").textContent = `Tip: ${stepEco.tip}`; 
            speechSynthesis.speak(ecoMsg);
          };
          
          // ✅ Smart Failsafe Timer (checks distance instead of time only)
          clearTimeout(speechTimer);
          speechTimer = setTimeout(() => {
            const driverMoved = lastStepLatLng ? latlng.distanceTo(lastStepLatLng) > 25 : false;
            const stillFarFromStep = distanceToStep > 120;
            const longSinceLastAdvance = Date.now() - lastStepAdvanceTime > 60000; // 60s
            if (currentSpeed < 5) return; // Don't advance while stopped
            if (driverMoved && distanceToStep <= 80) {
              console.warn("Driver reached step — advancing.");
              advanceStep();
            } else if (longSinceLastAdvance && stillFarFromStep) {
              console.warn("Idle too long — skipping speech repeat only.");
              nextStepReady = true;
            }
          }, 10000); // recheck every 10 s instead of fixed 15 s

          // Start the speech chain
          document.getElementById("ai-tip").textContent = `Step ${currentStepIndex + 1}: ${step.text}`;
          lastStepLatLng = latlng;                 // Save position when step starts
          lastStepAdvanceTime = Date.now();        // Reset step timer
          speechSynthesis.speak(stepMsg);

        } else {
            // Fallback: advance/unlock immediately
            document.getElementById("ai-tip").textContent = `Tip: ${stepEco.tip}`;
            // Remove current step visuals
            if (step.element) step.element.remove();
            if (step.lineLayer) route.group.removeLayer(step.lineLayer);
            // Also remove the connecting line to next step (if any)
            if (step.connectorLine) route.group.removeLayer(step.connectorLine);
            currentStepIndex++;
            nextStepReady = true;
        }
      }
    } else {
      // Route finished
      document.getElementById("ai-tip").textContent = "Destination reached ✅";
      const distanceEl = document.getElementById(`route-distance-${route.routeIndex}`);
      if (distanceEl) { distanceEl.textContent = `0.0 km remaining`; }
        
      if (activeRouteIndex !== null) { // Only speak once
          if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance("Destination reached"));
          activeRouteIndex = null;
          currentStepIndex = 0;
          nextStepReady = true;
      }
    }
  } else {
    // 4. Update Tip Box with General Eco Tip (when no route is active)
    document.getElementById("ai-tip").textContent = `Tip: ${eco.tip} | Road: ${eco.roadType}`;
  }

  // 5. Apply dynamic eco hints and update dashboard (Always runs)
  updateDriverBehavior(currentSpeed, eco);
  overspeedWarning(currentSpeed, eco.speed);
  document.getElementById("speed").textContent = eco.speed + " km/h";
  document.getElementById("gear").textContent = eco.gear;
  document.getElementById("throttle").textContent = eco.throttle + "%";
}
/* ===== GPS speed and idle detection (Unchanged) ===== */
let lastLatLng=null, lastGPSPos=null, lastGPSTime=null, idleStart=null;
const IDLE_THRESHOLD=3, IDLE_TIME=60;
function checkIdle(latlng){
    if(!lastLatLng){ lastLatLng=latlng; idleStart=Date.now(); return false; }
    const dist=latlng.distanceTo(lastLatLng);
    if(dist<IDLE_THRESHOLD){ if(!idleStart) idleStart=Date.now(); return (Date.now()-idleStart)/1000 >= IDLE_TIME; }
    lastLatLng=latlng; idleStart=null; return false;
}

function calculateGPSSpeed(latlng){
    const now=Date.now();
    if(lastGPSPos && lastGPSTime){
        const dist=latlng.distanceTo(lastGPSPos);
        const dt=(now-lastGPSTime)/1000;
        lastGPSPos=latlng; lastGPSTime=now;
        return (dist/dt)*3.6;
    }else{ lastGPSPos=latlng; lastGPSTime=now; return 0; }
}

/* ===== Predict multi-step elevation ahead (MODIFIED: 200m Lookahead) ===== */
const ELEVATION_INTERVAL=50; 
const LOOKAHEAD_DISTANCE=200;  // FIXED to 200m
let recentElevations=[];
async function predictElevationAhead(latlng,heading){
    const R=6378137; 
    const pointsAhead=[];
    for(let d=ELEVATION_INTERVAL; d<=LOOKAHEAD_DISTANCE; d+=ELEVATION_INTERVAL){
        const latRad=latlng.lat*Math.PI/180, lonRad=latlng.lng*Math.PI/180;
        // Haversine formula approximation for new lat/lng (unchanged)
        const newLat=latRad+(d*Math.cos(heading*Math.PI/180))/R;
        const newLng=lonRad+(d*Math.sin(heading*Math.PI/180))/(R*Math.cos(latRad));
        pointsAhead.push({lat:newLat*180/Math.PI,lng:newLng*180/Math.PI});
    }
    const elevs=await getElevations(pointsAhead);
    recentElevations=elevs;
    // Calculate slope from first point (current) to last point (200m ahead)
    if(elevs.length < 2) return { elevs, slope: 0 };
    // We assume the first mock elevation is the current elevation, so we calculate the change over 200m.
    const elevationChange = elevs[elevs.length - 1] - elevs[0];
    const avgSlope = (elevationChange / LOOKAHEAD_DISTANCE) * 100; // Slope in percentage (meters up/down per 100 meters)
    return {elevs, slope:avgSlope};
}

/* ===== GPS Watch (MODIFIED: Car Icon, Stable Rotation, and Initialization) ===== */
if(navigator.geolocation){
    navigator.geolocation.watchPosition(async pos=>{
        const latlng=L.latLng(pos.coords.latitude,pos.coords.longitude);
        const currentSpeed = calculateGPSSpeed(latlng); // Calculate speed for stability check
    
        // FIX: Only use heading if available and speed is above a minimum threshold (~5 km/h)
        let heading = pos.coords.heading;
        const MIN_SPEED_FOR_HEADING = 5 / 3.6; // ~1.4 m/s (5 km/h)
        
        // If heading is null OR speed is too low, keep the last known rotation
        if (heading === null || currentSpeed < MIN_SPEED_FOR_HEADING) {
            // Get the last known rotation from the SVG element if the marker exists
            const carEl = document.getElementById('user-car-svg');
            if (carEl) {
                // Extracts the number from a string like "rotate(90deg)"
                const currentTransform = carEl.style.transform;
                const match = currentTransform.match(/rotate\(([^)]+)deg\)/);
                heading = match ? parseFloat(match[1]) : 0;
            } else {
                heading = 0; // Default to North if no element found
            }
        }
        
        if(!waypoints.length) waypoints.push(latlng); else waypoints[0]=latlng;
        
        // Change: Use the rotating car icon
        if(!userMarker){ 
            // Change: carIcon instead of arrowIcon
            userMarker=L.marker(latlng,{icon:carIcon}).addTo(map); 
            map.setView(latlng,22); // Centers map on user's actual location
        } else {
            userMarker.setLatLng(latlng);
        }
        // 🧭 Auto-follow logic: Keep car centered only if user hasn’t manually moved
        if (autoFollow) {
            map.panTo(latlng, { animate: true });
        }
                
        // ROTATE THE CAR SVG (The core fix for direction)
        const carEl = document.getElementById('user-car-svg');
        if (carEl) {
            // Apply the heading in degrees, correctly rotating the car
            carEl.style.transform = `rotate(${heading}deg)`; 
        }
        if (speechSynthesis.pending && !speechSynthesis.speaking)
          speechSynthesis.resume();

        await adaptiveAIDashboard(latlng,heading);
        checkOffRoute(latlng);
    },()=>console.warn("GPS unavailable"),{enableHighAccuracy:true, maximumAge: 1000, timeout: 5000});
}

let driverCountry = null;

async function updateDriverCountry(latlng) {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}&zoom=5&addressdetails=1`;
    const res = await fetch(url);
    const data = await res.json();
    driverCountry = data.address && (data.address.country_code || "").toUpperCase();
    console.log("📍 Driver country detected:", driverCountry);
  } catch (err) {
    console.warn("Country fetch failed:", err);
  }
}
/* ===== Off-route adaptation (Unchanged) ===== */
async function checkOffRoute(latlng){
    if(routes.length){
        const nearestRoute=routes[0];
        let minDist=Infinity;
        nearestRoute.steps.forEach(s=>{ const d=latlng.distanceTo([s.lat,s.lng]); if(d<minDist) minDist=d; });
        if(minDist>30){
            console.log("Off-route detected — recalculating");
            if(waypoints.length>=1){
                const lastWaypoint=waypoints[waypoints.length-1];
                // Recalculate from current position to the destination
                createRoute(latlng,lastWaypoint,colors[routes.length%colors.length], null, activeRouteIndex);
            }
        }
    }
}

/* ===== Route creation & step-box integration (MODIFIED: Deletion Logic) ===== */
async function createRoute(start, end, color, marker = null, index = null) {
    // Determine the 0-based index for the internal array and 1-based index for display/ID
    const routeIndex = index !== null ? index : routes.length; 
    const displayIndex = index !== null ? index + 1 : routes.length + 1; 

    // Check for duplicate destination
    const endKey = `${end.lat.toFixed(6)},${end.lng.toFixed(6)}`;
    const existing = routes.find(r => r.endKey === endKey);
    if (existing) return; 
    const routeColor = color || colors[(routeIndex) % colors.length];

    const rc = L.Routing.control({
        waypoints: [start, end],
        router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
        show: false, addWaypoints: false, createMarker: () => null,
        lineOptions: { styles: [{ color: routeColor, weight: 5, opacity: 0.9 }] }
    }).addTo(map);
    const group = L.layerGroup().addTo(map);
// Hide the small Leaflet routing summary box completely 👇
    document.querySelectorAll('.leaflet-routing-container').forEach(el => el.style.display = 'none');

    // Route box
    const box = document.createElement('div'); box.className = 'route-box';
    const header = document.createElement('div'); header.className = 'route-header';
    header.style.background = routeColor;
    header.innerHTML = `<b>Route ${displayIndex}</b> <span id="route-distance-${routeIndex}" style="font-weight:normal;">Calculating...</span>
        <button style="background:#ff4c4c;border:none;color:#fff;border-radius:50%;width:22px;height:22px;">✕</button>`;
    const content = document.createElement('div'); content.className = 'route-content';
    content.style.display = 'block'; box.appendChild(header); box.appendChild(content);
    document.getElementById('routePanel').appendChild(box);
    header.onclick = () => content.style.display = content.style.display === 'block' ? 'none' : 'block';
    
    // FIXED: Deletion Logic
    header.querySelector('button').onclick = (e) => {
        e.stopPropagation();
        const idx = routes.findIndex(r => r.rc === rc); 
        if (idx !== -1) {
            // 1. If active route deleted, stop voice and reset state
            if (activeRouteIndex === idx) {
                if (speechSynthesis.speaking) { speechSynthesis.cancel(); } // STOP VOICE IMMEDIATELY
                activeRouteIndex = null;
                currentStepIndex = 0;
            }

            // 2. Remove route and markers
            map.removeControl(rc); map.removeLayer(group); box.remove();
            routes.splice(idx, 1);
        }
        if (marker) {
            const wpIdx = waypointMarkers.indexOf(marker);  
            if (wpIdx !== -1) { map.removeLayer(marker); waypointMarkers.splice(wpIdx, 1); waypoints.splice(wpIdx + 1, 1); }
        }
        
        // 3. Rebuild and check for auto-start on next available route
        rebuildRoutes();
        
        // 4. Auto-start next route if one exists and was active
        if (activeRouteIndex === null && routes.length > 0) {
            routes.forEach((r, i) => r.routeIndex = i); // Re-index routes
            activeRouteIndex = 0; // Set the first route in the new array as active
            currentStepIndex = 0;
            nextStepReady = true;
            speakCurrentStep(); // Start voice guidance for the new active route
        } else if (routes.length === 0) {
            document.getElementById('ai-tip').textContent = 'Drive smoothly';
        }
    };

    rc.on('routesfound', async e => {
        const route = e.routes[0];
        const coords = route.coordinates.map(c => ({ lat: c.lat, lng: c.lng }));
        const elevs = await getElevations(coords);
        const steps = [];
        content.innerHTML = '';
        route.instructions.forEach((s, j) => {
            const idxStart = s.index;
            const idxEnd = j + 1 < route.instructions.length ? route.instructions[j + 1].index : coords.length;
            const segmentCoords = coords.slice(idxStart, idxEnd).map(c => [c.lat, c.lng]);
            const elev = elevs[idxStart] || 0;
            // Draw connected path segments (each connecting to next step)
            const stepLine = L.polyline(segmentCoords, { color: routeColor, weight: 5, opacity: 0.8 }).addTo(group);

            // Store connection info for dynamic removal
            if (j > 0) {
                // Connect previous step line with this one
                const prevStep = steps[j - 1];
                if (prevStep && prevStep.lineLayer) {
                    const lastLat = prevStep.lineLayer.getLatLngs().slice(-1)[0];
                    const newLat = segmentCoords[0];
                    const connector = L.polyline([lastLat, newLat], { color: routeColor, weight: 3, opacity: 0.6 }).addTo(group);
                    prevStep.connectorLine = connector; // save link line
                }
            }
            const eco = ecoAdvisor(s.distance, elev, s.text);
            const item = document.createElement('div');
            item.className = 'route-step';
            item.innerHTML = `<b>${s.text}</b><div>${(s.distance / 1000).toFixed(2)} km | Elev ${elev.toFixed(1)} m`;
            content.appendChild(item);
            item.addEventListener('mouseenter', () => stepLine.setStyle({ color: '#00FF00', weight: 6, opacity: 0.9 }));
            item.addEventListener('mouseleave', () => stepLine.setStyle({ color: routeColor, weight: 5, opacity: 0.5 }));
            steps.push({ 
                lat: coords[idxStart].lat, 
                lng: coords[idxStart].lng, 
                text: s.text, 
                elev, 
                element: item, // DOM element for removal
                distance: s.distance, // Distance for remaining distance calc
                lineLayer: stepLine // Leaflet layer for removal
            });
        });
        // If this is a re-route, find the existing slot and replace/update
        let currentRouteSlot = routes.find(r => r.routeIndex === routeIndex);
        if (currentRouteSlot) {
             currentRouteSlot.rc = rc; 
             currentRouteSlot.group = group; 
             currentRouteSlot.steps = steps; 
             currentRouteSlot.totalDistance = route.summary.totalDistance;
        } else {
            // New route, push it to the array
            routes.push({ rc, group, steps, color: routeColor, endKey, totalDistance: route.summary.totalDistance, routeIndex: routeIndex });
        }
        
        const totalRouteDistance = route.summary.totalDistance;
        document.getElementById(`route-distance-${routeIndex}`).textContent = `${(totalRouteDistance / 1000).toFixed(1)} km total`;
        
        // Set as active route if no other route is in progress
        if (activeRouteIndex === null) {
            activeRouteIndex = routeIndex;
            currentStepIndex = 0;
            speakCurrentStep(); // Speak the first step immediately
        }
    });
}


/*================Multi-step AI Tip Blending + Voice (FIXED)=============*/
function speakCurrentStep() {
  if (activeRouteIndex === null || !routes[activeRouteIndex]) return;
  const route = routes[activeRouteIndex];
  // Start from currentStepIndex, not just index 0
  const step = route.steps[currentStepIndex]; 
  if (!step) return;

  const eco = ecoAdvisor(step.distance, step.elev, step.text);
  const stepDistance = step.distance < 1000 ? `${step.distance.toFixed(0)} meters` : `${(step.distance / 1000).toFixed(1)} kilometers`;

  // 1. Speak Step Instruction and Distance
  const stepMsg = new SpeechSynthesisUtterance(
    `${currentStepIndex === 0 ? 'Starting route. ' : ''}${step.text}. Proceed for ${stepDistance}`
  );
  stepMsg.rate = 1; stepMsg.pitch = 1;
  
  // 2. Speak Eco Tip after step instruction (REMOVED SPEED/GEAR)
  const ecoMsg = new SpeechSynthesisUtterance(
    `Eco Tip: ${eco.tip}`
  );
  ecoMsg.rate = 1; ecoMsg.pitch = 1;

  if ("speechSynthesis" in window) {
      if (speechSynthesis.speaking) { speechSynthesis.cancel(); } // Ensure no old messages interfere

      const advanceStepOnEnd = () => {
          // Manually advance step and unlock if needed
      }

    // Chain the messages
    stepMsg.onend = () => {
      // Update tip box to Eco Tip after step instruction finishes
      document.getElementById("ai-tip").textContent = `Tip: ${eco.tip}`; 
      speechSynthesis.speak(ecoMsg);
    };
    
    ecoMsg.onend = advanceStepOnEnd; // Use the same end logic as the main loop to advance

    // Start the speech chain and update tip box to Step Instruction
    document.getElementById("ai-tip").textContent = `Step ${currentStepIndex + 1}: ${step.text}`; 
    speechSynthesis.speak(stepMsg);
  } else {
    document.getElementById("ai-tip").textContent = `Tip: ${eco.tip}`;
  }
}

/* ===== Add waypoint on map click (Unchanged) ===== */
map.on('click',e=>{
    const latlng=e.latlng; waypoints.push(latlng);
    const marker=L.marker(latlng).addTo(map); waypointMarkers.push(marker);
    if(waypoints.length>=2) createRoute(waypoints[waypoints.length-2],latlng,colors[routes.length%colors.length],marker);
});

/* ===== Rebuild Routes (MODIFIED: to re-index and ensure no duplicates) ===== */
function rebuildRoutes(){
    const currentWaypoints = [waypoints[0], ...waypoints.slice(1)];
    const markers = [...waypointMarkers];

    routes.forEach(r=>{ map.removeControl(r.rc); map.removeLayer(r.group); });
    routes=[]; document.getElementById('routePanel').innerHTML='';
    
    if(currentWaypoints.length<2) return;
    
    // Create new routes with correct indexing
    for(let i=1;i<currentWaypoints.length;i++){ 
        // Need to pass the original marker associated with the *destination* waypoint
        // Note: waypointMarkers[i-1] is the marker for waypoints[i]
        const destinationMarker = i - 1 < markers.length ? markers[i-1] : null; 
        // Pass a unique index for correct route management
        createRoute(currentWaypoints[i-1],currentWaypoints[i],colors[(i-1)%colors.length], destinationMarker, i - 1); 
    }
}

/* ===== Search Suggestions/Voice Search (Unchanged) ===== */
const input = document.getElementById("searchInput");
const suggestBox = document.getElementById("suggestBox");
let results = [];
let searchTimer = null;

async function getSearchResults(query) {
  const center = userMarker ? userMarker.getLatLng() : map.getCenter();
  const lang = driverCountry ? driverCountry.toLowerCase() : "en";

  // Use Photon first (faster + better local context)
  const photonURL = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${center.lat}&lon=${center.lng}&limit=8&lang=${lang}`;
  try {
    const res = await fetch(photonURL, { cache: "no-store" });
    const json = await res.json();
    if (json.features && json.features.length) {
      return json.features.map(f => ({
        name: f.properties.name || f.properties.street || f.properties.locality || "Unnamed",
        display_name: [f.properties.name, f.properties.city, f.properties.country].filter(Boolean).join(", "),
        lat: f.geometry.coordinates[1],
        lon: f.geometry.coordinates[0]
      }));
    }
  } catch (err) {
    console.warn("Photon failed, switching to Nominatim fallback:", err);
  }

  // Fallback: Nominatim (slower but reliable)
  try {
    const nomURL = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8&addressdetails=1&accept-language=${lang}`;
    const res = await fetch(nomURL, { cache: "no-store" });
    const data = await res.json();
    return data.map(f => ({
      name: f.display_name.split(",")[0],
      display_name: f.display_name,
      lat: parseFloat(f.lat),
      lon: parseFloat(f.lon)
    }));
  } catch (err) {
    console.error("Nominatim failed:", err);
    return [];
  }
}

// Debounced input listener for smooth UX
input.oninput = () => {
  const q = input.value.trim();
  if (searchTimer) clearTimeout(searchTimer);
  if (!q) return (suggestBox.style.display = "none");

  searchTimer = setTimeout(async () => {
    const data = await getSearchResults(q);
    results = data;
    suggestBox.innerHTML = "";
    if (!data.length) {
      suggestBox.style.display = "none";
      return;
    }

    data.forEach((f, i) => {
      const div = document.createElement("div");
      div.className = "suggest-item";
      div.innerHTML = `<b>${f.name}</b><div style="font-size:12px;color:#bbb;">${f.display_name}</div>`;
      div.onclick = () => selectResult(i);
      suggestBox.appendChild(div);
    });
    suggestBox.style.display = "block";
  }, 300); // debounce for 300 ms
};

document.addEventListener("click", e => {
  if (!suggestBox.contains(e.target) && e.target !== input)
    suggestBox.style.display = "none";
});

function selectResult(i) {
  const f = results[i];
  if (!f) return;
  const latlng = L.latLng(f.lat, f.lon);
  waypoints.push(latlng);
  const marker = L.marker(latlng).addTo(map);
  waypointMarkers.push(marker);
  if (waypoints.length >= 2)
    createRoute(waypoints[waypoints.length - 2], latlng, colors[routes.length % colors.length]);
  input.value = "";
  suggestBox.style.display = "none";
}

const micBtn = document.getElementById('micBtn');

micBtn.onclick = async () => {
  if (!('webkitSpeechRecognition' in window)) {
    alert('Speech Recognition not supported on this browser');
    return;
  }

  try {
    // Ask for microphone permission explicitly (like location)
    await navigator.mediaDevices.getUserMedia({ audio: true });

    const recog = new webkitSpeechRecognition();
    recog.lang = 'en-US';
    recog.interimResults = false;
    recog.maxAlternatives = 1;

    micBtn.textContent = '🎙️ Listening...';
    recog.start();

    recog.onresult = (e) => {
      const text = e.results[0][0].transcript;
      input.value = text;
      input.dispatchEvent(new Event('input'));
    };

    recog.onerror = (err) => {
      console.warn('Speech recognition error:', err);
      micBtn.textContent = '🎤';
    };

    recog.onend = () => {
      micBtn.textContent = '🎤';
    };

  } catch (err) {
    // Permission denied or mic unavailable
    console.error('Microphone access denied:', err);
    alert('Please allow microphone permission to use voice search.');
  }
};
